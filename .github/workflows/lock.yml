---
name: Lock Threads

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads

jobs:
  lock:
    name: 🔒 Lock closed issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6.0.2
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: "30"
          issue-lock-reason: ""
          exclude-any-issue-labels: "automatic-issue"
          issue-comment: >
            This issue has been closed for 30 days and is now locked.

            If you encounter the same problem, please open a new issue and
            refer to this one.
          pr-inactive-days: "7"
          pr-lock-reason: ""
          pr-comment: >
            This pull request has been closed for 7 days and is now locked.

            To follow up, please open a new issue or pull request that
            references this one.
