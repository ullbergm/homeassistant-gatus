---
name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  # Run weekly so the badge and SARIF results stay fresh
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard requires GraphQL access that GITHUB_TOKEN cannot grant on
    # private repos. This job is a no-op until the repo is made public, at
    # which point it will start running automatically.
    if: github.event.repository.visibility == 'public'
    permissions:
      # Required to upload the SARIF results to GitHub code-scanning
      security-events: write
      # Required to publish results to the OpenSSF REST API (public repos only)
      id-token: write
      contents: read
      actions: read

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🔒 Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Job only runs when visibility == 'public', so publishing is safe.
          publish_results: true

      - name: 📤 Upload SARIF results to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
