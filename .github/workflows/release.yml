---
name: Release

# When a (draft) release is published, stamp the tag version into
# manifest.json and attach the integration as gatus.zip. HACS installs from
# that asset (see zip_release in hacs.json), so the installed manifest version
# always matches the release tag.
on:
  release:
    types:
      - published

permissions: {}

jobs:
  release:
    name: Upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp version into manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          manifest=custom_components/gatus/manifest.json
          jq --arg version "${version}" '.version = $version' "${manifest}" > "${manifest}.tmp"
          mv "${manifest}.tmp" "${manifest}"
          jq -r '.version' "${manifest}"

      - name: Build gatus.zip
        working-directory: custom_components/gatus
        run: zip -r "${RUNNER_TEMP}/gatus.zip" . -x '*/__pycache__/*' -x '__pycache__/*'

      - name: Upload gatus.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" "${RUNNER_TEMP}/gatus.zip" --clobber --repo "${GITHUB_REPOSITORY}"
